spring.application.name=stayhub

# PostgreSQL connection (placeholder credentials for local development)
spring.datasource.url={jdbc string here}
spring.datasource.username={username here}
spring.datasource.password={password here}
spring.datasource.driver-class-name={driver class here}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (placeholder secret for local development; override via env var in real deployments)
jwt.secret={minimum 32 chars long secret string here}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
